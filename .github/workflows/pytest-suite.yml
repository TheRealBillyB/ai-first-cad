name: pytest suite

# Called from tests.yml. This workflow does not start on its own.
on:
  workflow_call:
    inputs:
      os:
        description: Runner image
        required: true
        type: string
      python-version:
        description: Python version to install
        required: true
        type: string
      job-timeout:
        description: Whole-job timeout passed to timeout-minutes
        required: true
        type: number

permissions:
  contents: read
  actions: write

jobs:
  pytest:
    name: pytest (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.job-timeout }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # install.py still installs the same apt packages. This only keeps the
      # downloaded archives so a later run does not download them again.
      - name: Cache apt package archives
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('install.py') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Point apt at the archive cache
        if: runner.os == 'Linux'
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.apt-archives"
          printf 'Dir::Cache::Archives "%s";\n' "${GITHUB_WORKSPACE}/.apt-archives" | sudo tee /etc/apt/apt.conf.d/99-aicad-archive-cache >/dev/null

      - name: Install aicad
        run: python install.py

      - name: Make the apt archive cache readable
        if: runner.os == 'Linux' && always()
        run: |
          if [ -d "${GITHUB_WORKSPACE}/.apt-archives" ]; then
            sudo chmod -R a+rX "${GITHUB_WORKSPACE}/.apt-archives"
          fi

      - name: Check the install and CalculiX
        run: python install.py --check

      - name: Run the Windows sandbox tests
        if: inputs.os == 'windows-latest'
        timeout-minutes: 15
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          # These run on their own first. A confinement failure shows up here,
          # and this step stops after 15 minutes instead of holding the whole job.
          exec .venv/Scripts/pytest.exe -ra --tb=short --durations=15 --timeout=180 \
            tests/test_sandbox.py tests/test_sandbox_findings.py

      - name: Run the test suite
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          # -s and a line-buffered interpreter so a failure is in the log
          # even when the job is stopped before pytest prints its summary.
          if [ -x .venv/bin/pytest ]; then
            PY=.venv/bin/pytest
          else
            PY=.venv/Scripts/pytest.exe
          fi
          if [ "${{ inputs.os }}" = "windows-latest" ]; then
            exec "$PY" -ra --tb=short --durations=15 \
              --ignore=tests/test_sandbox.py --ignore=tests/test_sandbox_findings.py
          fi
          exec "$PY" -ra --tb=short --durations=15
