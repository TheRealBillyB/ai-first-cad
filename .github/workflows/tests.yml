name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu stays on 3.12, which is what the Linux suite was written against.
          # Windows and macOS use 3.11 because the sketch solver publishes wheels
          # for 3.11 and not for 3.12. 3.12 on those systems would have to compile it.
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install aicad
        run: python install.py

      - name: Check the install and CalculiX
        run: python install.py --check

      - name: Run the test suite
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          # -s and a line-buffered interpreter so a failure is in the log
          # even when the job is stopped before pytest prints its summary.
          if [ -x .venv/bin/pytest ]; then
            exec .venv/bin/pytest -ra --tb=short --durations=15
          fi
          exec .venv/Scripts/pytest.exe -ra --tb=short --durations=15
