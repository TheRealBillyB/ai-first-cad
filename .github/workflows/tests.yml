name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CalculiX and the libraries the geometry kernel loads
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            calculix-ccx \
            libgl1 libglu1-mesa libglib2.0-0 \
            libx11-6 libxext6 libxrender1 libxcursor1 libxfixes3 libxft2 libxinerama1 \
            libfontconfig1 \
            build-essential python3-dev

      - name: Install aicad
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,robot]"

      - name: Run the test suite
        run: pytest
