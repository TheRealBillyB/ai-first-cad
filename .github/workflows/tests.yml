name: tests

# Ubuntu runs on every push and pull request. Windows and macOS run on every
# pull request, on every push to main, and when the workflow is started manually.
on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run it replaced. Push and manual
# runs each keep their own id, so they do not cancel each other or a pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  pytest:
    name: pytest (ubuntu-latest)
    # Ubuntu stays on 3.12, which is what the Linux suite was written against.
    uses: ./.github/workflows/pytest-suite.yml
    with:
      os: ubuntu-latest
      python-version: "3.12"
      # The full suite now uses most of 25 minutes here too, so this job gets
      # the same backstop as Windows and macOS. A single test still stops sooner.
      job-timeout: 40

  pytest-cross:
    name: pytest (${{ matrix.os }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows and macOS use 3.11 because the sketch solver publishes wheels
          # for 3.11 and not for 3.12. 3.12 on those systems would have to compile it.
          # The job clock is a backstop. A single test is stopped sooner by pytest-timeout.
          # The macOS suite already uses most of 25 minutes, so it gets the same clock as Windows.
          # Windows runs sandboxed tests one at a time, and that took 33 to 35 minutes
          # of the 40-minute clock. Each shard is its own runner. See tests/shards.py.
          - os: windows-latest
            python: "3.11"
            job-timeout: 40
            shard: 1/3
          - os: windows-latest
            python: "3.11"
            job-timeout: 40
            shard: 2/3
          - os: windows-latest
            python: "3.11"
            job-timeout: 40
            shard: 3/3
          - os: macos-latest
            python: "3.11"
            job-timeout: 40
    uses: ./.github/workflows/pytest-suite.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python }}
      job-timeout: ${{ matrix.job-timeout }}
      shard: ${{ matrix.shard || '' }}

  windows-current-python:
    name: standard accounts run scripts (windows-latest, current Python)
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # setup-python's 3.11 is 3.11.9, the last release with a Windows installer.
      # A person's Python is newer, and 3.11.10 and later make os.mkdir(path, 0o700)
      # an owner-only folder. uv publishes those releases. The folder is outside the
      # runner's profile, so the accounts can copy it.
      - name: Install a current Python 3.11 with aicad, as a person's install has
        shell: bash
        env:
          UV_PYTHON_INSTALL_DIR: C:/aicad-python
        run: |
          python -m pip install --disable-pip-version-check "uv==0.12.10"
          uv python install 3.11
          PY="$(uv python find 3.11 --managed-python)"
          "$PY" -c "import sys; print(sys.version); assert sys.version_info >= (3, 11, 10), sys.version"
          uv pip install --python "$PY" --system --break-system-packages .
          echo "ACCOUNT_PYTHON=$PY" >> "$GITHUB_ENV"

      - name: Set up the Windows sandbox once
        shell: bash
        run: '"$(dirname "$ACCOUNT_PYTHON")/Scripts/aicad.exe" sandbox-setup'

      - name: Run design scripts as standard accounts
        timeout-minutes: 25
        shell: bash
        run: '"$ACCOUNT_PYTHON" .github/scripts/check_account_runs_scripts.py'
