name: macos geometry repro

# One-off runner for the hypoid mesh check. Not part of the suite.
on:
  push:
    branches:
      - cursor/macos-geometry-stack-6af7

permissions:
  contents: read

jobs:
  hypoid:
    name: hypoid mesh check
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install aicad
        run: python install.py

      - name: Reproduce the hypoid mesh check, then run it on the calling thread
        run: python .github/scripts/macos_geometry_repro.py

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-diagnostic-reports
          path: macos-diagnostic-reports
          if-no-files-found: warn
