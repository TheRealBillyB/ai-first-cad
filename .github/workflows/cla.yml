name: CLA

# pull_request_target runs the workflow file from the base branch and uses
# the base repository token. This job does not check out the repository and
# does not run pull request code. It uses the GitHub API only.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor License Agreement
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/TheRealBillyB/ai-first-cad/blob/main/CLA.md
          # This branch holds signatures only. It must not be a protected branch.
          branch: cla-signatures
          # Allowlisted accounts pass with no signature comment. The list is
          # the repository owner and the accounts that already commit or open
          # pull requests here.
          allowlist: "TheRealBillyB,cursoragent,cursor[bot],Cursor Agent,dependabot[bot],github-actions[bot]"
          # The signature is stored in the JSON file, so the conversation stays unlocked.
          lock-pullrequest-aftermerge: "false"
