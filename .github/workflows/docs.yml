name: docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  allowlist:
    name: Documentation allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check documentation entry files
        run: python tools/build_docs.py --check

      - name: Check documentation words
        run: python tools/check_docs.py

      - name: Fetch the pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Reject hand edits of generated masters
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: origin/${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
        run: python tools/build_docs.py --forbid-master-edits --base "$PR_BASE" --branch "$PR_HEAD"

      - name: Reject documents outside the allowlist
        run: |
          python -m pip install pytest
          pytest tests/test_docs_allowlist.py tests/test_build_docs.py
