<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Thermal analysis"><title>Thermal analysis</title><style>
.ln{fill:none;stroke:#e6edf7;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
