[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicad"
version = "0.1.0"
description = "AI-first CAD for hard-body parts. Model a solid, then see and check it."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "TheRealBillyB" }]
keywords = ["cad", "build123d", "mcp", "3d-printing", "mechanical"]
dependencies = [
    "build123d>=0.13",
    "mcp>=1.2",
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aicad = "aicad.cli:main"

[project.urls]
Homepage = "https://github.com/TheRealBillyB/ai-first-cad"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aicad = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
