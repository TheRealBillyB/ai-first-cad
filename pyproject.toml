[build-system]
requires = ["setuptools>=68"]
build-backend = "build_meta"
backend-path = ["packaging"]

[project]
name = "aicad"
version = "0.9.0"
description = "AI-first CAD for hard-body parts. Model a solid, then see and check it."
readme = "README.md"
# SPDX expression only. Current setuptools rejects a License :: classifier beside it (PEP 639).
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "TheRealBillyB" }]
keywords = ["cad", "build123d", "mcp", "3d-printing", "mechanical"]
dependencies = [
    "bd_warehouse>=0.4",
    "build123d>=0.13",
    "gmsh>=4.12,<5",
    "mcp>=1.2",
    "numpy>=1.26",
    "pillow>=10",
    "python-solvespace>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3"]
robot = ["mujoco>=3.1"]

[project.scripts]
aicad = "aicad.cli:main"

[project.urls]
Homepage = "https://github.com/TheRealBillyB/ai-first-cad"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aicad = ["py.typed", "app_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# A stuck test fails here instead of holding the CI job until the job clock
# runs out. The Windows sandbox step uses a shorter limit.
timeout = 300
timeout_method = "thread"
markers = [
    "sandbox: design-script confinement, run on every operating system",
    "sandbox_linux: Linux Landlock and seccomp sandbox",
    "sandbox_macos: macOS Seatbelt sandbox",
    "sandbox_windows: Windows AppContainer and Job Object sandbox",
]
